[package]
name = "utf8-to-utf32"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Fast UTF-8 to UTF-32 conversion with std-compatible errors, lossy/C1 modes and a chunk decoder; pure Rust, runtime-dispatched SSE4.1/AVX2/AVX-512."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lu-zero/utf8-to-utf32"
homepage = "https://github.com/lu-zero/utf8-to-utf32"
keywords = ["utf-8", "utf-32", "unicode", "simd", "decoding"]
categories = ["encoding", "text-processing", "no-std"]
exclude = ["/bench", "/results-*.md", "/.gitignore"]

[features]
default = ["std"]
# Runtime CPU feature detection and the UTF32_LEVEL override. Implies alloc.
std = ["alloc"]
# Vec-based APIs: utf8_to_utf32_lossy_into and Decoder.
alloc = []

[dependencies]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[workspace]
members = ["bench"]

[profile.release]
lto = true
codegen-units = 1

[profile.test]
opt-level = 2
