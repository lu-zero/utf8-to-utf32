[package]
name = "utf8-to-utf32"
version = "0.2.2"
edition = "2021"
rust-version = "1.89"
description = "Fast, SIMD-accelerated UTF-8 to UTF-32 conversion with std-compatible errors."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lu-zero/utf8-to-utf32"
keywords = ["utf-8", "utf-32", "unicode", "simd", "decoding"]
categories = ["encoding", "text-processing", "no-std"]
exclude = ["/bench", "/AGENTS.md", "/.gitignore"]

[features]
default = ["std"]
# Runtime CPU feature detection and the UTF32_LEVEL override. Implies alloc.
std = ["alloc"]
# Vec-based APIs: utf8_to_utf32_lossy_into and Decoder.
alloc = []
# POWER9 VSX kernel. Requires a nightly toolchain.
vsx = []
# riscv64 RVV kernel. Requires a nightly toolchain (`riscv_target_feature`).
rvv = []

[dependencies]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "powerpc64le-unknown-linux-gnu", "riscv64gc-unknown-linux-gnu"]

[workspace]
members = ["bench"]

[profile.release]
lto = true
codegen-units = 1

[profile.test]
opt-level = 2
